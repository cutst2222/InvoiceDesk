name: Build macOS DMG

on:
  workflow_dispatch:

jobs:
  build-dmg:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            tauri-app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Install tauri dependencies
        run: npm --prefix tauri-app ci

      - name: Build DMG bundle
        run: npm --prefix tauri-app run tauri build -- --bundles dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: consultant-invoice-macos-dmg
          path: tauri-app/src-tauri/target/release/bundle/dmg/*.dmg
